# Radeon RX 550 on a big-endian Power Mac G5.
# This port is tested with the modesetting X driver. Its hardware cursor is
# written in host byte order while the display engine reads little-endian, and the display
# engine has no byte swap for the cursor, so use a software cursor.
Section "OutputClass"
    Identifier "RX550 G5 big-endian"
    MatchDriver "amdgpu"
    Driver "modesetting"
    Option "PrimaryGPU" "yes"
    Option "SWcursor" "true"
EndSection
