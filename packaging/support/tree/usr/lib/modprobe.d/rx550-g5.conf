# Radeon RX 550 on a big-endian Power Mac G5 (rx550-g5 package).
# runpm=0: keep the GPU powered; hotplug detection while runtime-suspended is untested on the G5.
# gpu_recovery=0: a full GPU reset fails on the G5 and can end in a kernel panic. The -rx550g5 kernel
# still tries soft recovery (killing a stuck shader) with gpu_recovery=0.
# lockup_timeout=10000: valid long jobs take more than the 2 s default on the G5's CPU; a job that
# crossed it would have its context rejected. 10 s is the older gfx default.
options amdgpu runpm=0 gpu_recovery=0 lockup_timeout=10000
# GPU system memory is mapped through the G5's 2 GB DART IOMMU window, which SATA, network, USB and
# audio share; slots without the 40-bit DART bypass cannot avoid it. The default GTT/TTM limit is
# larger than the window. Cap at 1536 MB (393216 4 KiB pages), leaving 512 MB for other devices.
options ttm pages_limit=393216
# Not loaded automatically at boot: rx550-g5.service loads it before the display manager and stops
# retrying after an interrupted probe. An explicit "modprobe amdgpu" still works.
blacklist amdgpu
