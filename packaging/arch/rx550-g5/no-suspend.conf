# rx550-g5: a Power Mac G5 does not wake from suspend (s2idle) under Linux, so a suspend looks
# like a hang (desktop idle timers suspend after ~15 min). Block all sleep states. Screen
# blanking and locking still work. Override in /etc/systemd/sleep.conf.d/ if you know better.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
