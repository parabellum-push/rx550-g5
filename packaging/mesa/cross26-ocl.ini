# Paths assume the work tree at /home/builder/g5-work; edit them to your own location.
[binaries]
rust = ['rustc', '--target', 'powerpc64-unknown-linux-gnu', '-C', 'linker=powerpc64-linux-gnu-gcc', '-C', 'target-cpu=970']
c = 'powerpc64-linux-gnu-gcc'
cpp = 'powerpc64-linux-gnu-g++'
ar = 'powerpc64-linux-gnu-ar'
strip = 'powerpc64-linux-gnu-strip'
pkg-config = '/home/builder/g5-work/m26/tools/ppc64-pkg-config'
llvm-config = '/home/builder/g5-work/m26/tools/llvm-config-22-ppc64.py'
[built-in options]
c_args = ['-mcpu=970','-idirafter','/home/builder/g5-work/m26/sysroot/usr/include','-idirafter','/home/builder/g5-work/m26/sysroot/usr/include/powerpc64-linux-gnu']
cpp_args = ['-mcpu=970','-idirafter','/home/builder/g5-work/m26/sysroot/usr/include','-idirafter','/home/builder/g5-work/m26/sysroot/usr/include/powerpc64-linux-gnu']
c_link_args = ['-L/home/builder/g5-work/m26/sysroot/usr/lib/powerpc64-linux-gnu','-Wl,-rpath-link,/home/builder/g5-work/m26/sysroot/usr/lib/powerpc64-linux-gnu','-Wl,--allow-shlib-undefined']
cpp_link_args = ['-L/home/builder/g5-work/m26/sysroot/usr/lib/powerpc64-linux-gnu','-Wl,-rpath-link,/home/builder/g5-work/m26/sysroot/usr/lib/powerpc64-linux-gnu','-Wl,--allow-shlib-undefined']
[properties]
bindgen_clang_arguments = ['--target=powerpc64-unknown-linux-gnu', '-mcpu=970', '-idirafter', '/home/builder/g5-work/m26/sysroot/usr/include', '-idirafter', '/home/builder/g5-work/m26/sysroot/usr/include/powerpc64-linux-gnu']
needs_exe_wrapper = true
[host_machine]
system = 'linux'
cpu_family = 'ppc64'
cpu = 'ppc970'
endian = 'big'
